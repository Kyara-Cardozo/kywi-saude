<header class="app-header">
  <div class="header-container">
    <div class="brand">
      <div class="brand-badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="#566700" />
          <circle cx="12" cy="12" r="7.5" fill="#C7F000" />
          <circle cx="12" cy="12" r="3.2" fill="#E5F0FE" />
          <circle cx="12" cy="6.8" r="0.75" fill="#1A1E04" />
          <circle cx="15.6" cy="8.3" r="0.75" fill="#1A1E04" />
          <circle cx="17.2" cy="12" r="0.75" fill="#1A1E04" />
          <circle cx="15.6" cy="15.7" r="0.75" fill="#1A1E04" />
          <circle cx="12" cy="17.2" r="0.75" fill="#1A1E04" />
          <circle cx="8.4" cy="15.7" r="0.75" fill="#1A1E04" />
          <circle cx="6.8" cy="12" r="0.75" fill="#1A1E04" />
          <circle cx="8.4" cy="8.3" r="0.75" fill="#1A1E04" />
        </svg>
      </div>
      <span class="brand-name">{{ 'HEADER.BRAND_MAIN' | translate }}
        <span class="highlight">{{ 'HEADER.BRAND_SUB' | translate }}</span></span>
    </div>

    <nav class="nav-links">
      <a routerLink="/peso-meta" routerLinkActive="active" class="nav-btn">
        <lucide-icon name="scale" class="ui-icon"></lucide-icon>
        {{ 'HEADER.MENU_WEIGHT' | translate }}
      </a>
      <a routerLink="/diario" routerLinkActive="active" class="nav-btn">
        <lucide-icon name="book-open" class="ui-icon"></lucide-icon>
        {{ 'HEADER.MENU_DIARY' | translate }}
      </a>
      <a routerLink="/gineco" routerLinkActive="active" class="nav-btn gyno-btn">
        <lucide-icon name="heart" class="ui-icon"></lucide-icon>
        {{ 'HEADER.MENU_GYNO' | translate }}
      </a>
    </nav>

    <div class="user-actions">
      <div class="lang-selector">
        <button class="lang-btn" [class.active]="i18n.currentLang() === 'pt'" (click)="switchLang('pt')">
          🇧🇷 PT
        </button>
        <button class="lang-btn" [class.active]="i18n.currentLang() === 'en'" (click)="switchLang('en')">
          🇺🇸 EN
        </button>
      </div>

      <a routerLink="/login" class="login-btn">{{ 'HEADER.LOGOUT_LOGIN' | translate: i18n.currentLang() }}</a>
    </div>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
